plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.morphinalert'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexus.morphinalert'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
